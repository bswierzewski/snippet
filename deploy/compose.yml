services:
  db:
    container_name: snippet_db
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    env_file:
      - ./.env # Loads all variables from the .env file
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - snippet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: snippet_backend
    # Image and tag variables are loaded from the .env file
    image: ${DOCKER_USERNAME}/snippet-backend:${BACKEND_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ./.env # Loads all variables from the .env file
    depends_on:
      db:
        condition: service_healthy
    networks:
      - snippet-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=snippet"

  frontend:
    container_name: snippet_frontend
    # Image and tag variables are loaded from the .env file
    image: ${DOCKER_USERNAME}/snippet-frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ./.env # Loads all variables from the .env file
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - snippet-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=snippet"

  caddy:
    container_name: snippet_caddy
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Required for HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - snippet-network

  watchtower:
    container_name: snippet_watchtower
    image: containrrr/watchtower:latest
    restart: always
    volumes:
      # Mount Docker socket to allow Watchtower to control Docker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Check for updates every 5 minutes (300 seconds)
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_POLL_INTERVAL:-300}
      # Only update containers with this label (or all if not set)
      - WATCHTOWER_LABEL_ENABLE=${WATCHTOWER_LABEL_ENABLE:-false}
      # Clean up old images after updating
      - WATCHTOWER_CLEANUP=${WATCHTOWER_CLEANUP:-true}
      # Include stopped containers in updates
      - WATCHTOWER_INCLUDE_STOPPED=${WATCHTOWER_INCLUDE_STOPPED:-false}
      # Include restarting containers
      - WATCHTOWER_INCLUDE_RESTARTING=${WATCHTOWER_INCLUDE_RESTARTING:-true}
      # Run once and exit (false = continuous monitoring)
      - WATCHTOWER_RUN_ONCE=${WATCHTOWER_RUN_ONCE:-false}
      # Notification URL for updates (optional - e.g., Slack, Discord)
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
      # Log level (trace, debug, info, warn, error, fatal, panic)
      - WATCHTOWER_TRACE=${WATCHTOWER_TRACE:-false}
      - WATCHTOWER_DEBUG=${WATCHTOWER_DEBUG:-false}
      # Monitor only specific containers (leave empty to monitor all)
      - WATCHTOWER_SCOPE=${WATCHTOWER_SCOPE:-snippet}
    # Optional: Add label-based filtering
    # labels:
    #   - "com.centurylinklabs.watchtower.scope=snippet"
    networks:
      - snippet-network

networks:
  snippet-network:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
