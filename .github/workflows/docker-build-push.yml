# Name of the entire GitHub Actions workflow. This is displayed in the "Actions" tab.
name: Build and Push Docker Images

# --- Triggers ---
# Defines the events that will trigger this workflow to run.
on:
  # Trigger the workflow on push events
  push:
    # Only for pushes to the main and develop branches
    branches:
      - main
      - develop
    # Only if changes are detected in these specific paths
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-build-push.yml"
  # Also trigger on pull request events
  pull_request:
    # Only for pull requests targeting the main and develop branches
    branches:
      - main
      - develop

# --- Environment Variables ---
# Variables available to all jobs in this workflow.
env:
  REGISTRY: docker.io # Specifies the Docker registry to use (Docker Hub)

# --- Jobs ---
# A workflow run is made up of one or more jobs, which run in parallel by default.
jobs:
  # The single job in this workflow, responsible for building the images.
  build:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    # Permissions granted to the GITHUB_TOKEN for this job.
    permissions:
      contents: read # Required to check out the repository code.
      packages: write # Required to push Docker images to a registry like Docker Hub.

    # --- Matrix Strategy ---
    # Creates a matrix of configurations. The job will run once for each item in the matrix.
    strategy:
      matrix:
        # Define a variable 'service' with a list of values.
        # This will create two parallel job runs: one with service='backend' and one with service='frontend'.
        service: [backend, frontend]

    # --- Steps ---
    # A sequence of tasks that will be executed as part of the job.
    steps:
      # Step 1: Check out the repository's code so the job can access it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Required to fetch BuildingBlocks submodule

      # Step 2: Use a path filter to determine if relevant files have changed.
      # This helps to skip building services that have not been modified.
      - name: Check for changed files
        id: changes # Assign an ID to this step to reference its outputs later.
        uses: dorny/paths-filter@v3
        with:
          # Define filters. If files matching a filter's patterns have changed, its output will be 'true'.
          filters: |
            backend: # Filter named 'backend'
              - 'backend/**'
              - '.github/workflows/docker-build-push.yml'
            frontend: # Filter named 'frontend'
              - 'frontend/**'
              - '.github/workflows/docker-build-push.yml'

      # Step 3: Set up Docker Buildx, an advanced builder that enables features like caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Log in to the Docker registry (Docker Hub).
      - name: Log in to Docker Hub
        # This step is conditional:
        # 1. It only runs on 'push' events, not on 'pull_request' events.
        # 2. It only runs if the 'paths-filter' step detected changes for the current service in the matrix.
        if: github.event_name != 'pull_request' && steps.changes.outputs[matrix.service] == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }} # Username stored securely in GitHub Secrets.
          password: ${{ secrets.DOCKER_PASSWORD }} # Password or token stored securely in GitHub Secrets.

      # Step 5: Automatically generate tags and labels for the Docker image.
      - name: Extract metadata (tags, labels)
        id: meta # Assign an ID to reference its outputs.
        # This step only runs if changes were detected for the current service.
        if: steps.changes.outputs[matrix.service] == 'true'
        uses: docker/metadata-action@v5
        with:
          # The full image name, constructed dynamically using the matrix variable.
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.service }}
          # Rules for generating tags based on Git events.
          tags: |
            type=ref,event=branch       # Tag with branch name (e.g., 'main')
            type=ref,event=pr           # Tag with pull request number (e.g., 'pr-123')
            type=sha,prefix={{branch}}- # Tag with branch and short commit SHA (e.g., 'main-a1b2c3d')
            type=raw,value=latest,enable={{is_default_branch}} # Tag 'latest' only for the default branch (usually 'main')

      # Step 6: Build the Docker image and push it to the registry.
      - name: Build and push Docker image
        # This step only runs if changes were detected for the current service.
        if: steps.changes.outputs[matrix.service] == 'true'
        uses: docker/build-push-action@v5
        with:
          # The build context (directory) is determined by the matrix variable.
          context: ./${{ matrix.service }}
          # The path to the Dockerfile.
          file: ./${{ matrix.service }}/Dockerfile
          # Push the image only on 'push' events, not on 'pull_request' events.
          push: ${{ github.event_name != 'pull_request' }}
          # Use the tags and labels generated by the 'meta' step.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up future builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass build arguments for frontend service
          build-args: |
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_SUPABASE_URL={0}', secrets.NEXT_PUBLIC_SUPABASE_URL) || '' }}
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_SUPABASE_ANON_KEY={0}', secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY) || '' }}

      # Step 7: An optional step to provide clear feedback if a build was skipped.
      - name: Notify if build was skipped
        # This step runs only if the 'paths-filter' did NOT detect changes for the service.
        if: steps.changes.outputs[matrix.service] == 'false'
        run: echo "Build for ${{ matrix.service }} was skipped as no relevant files were changed."
