# Name of the entire GitHub Actions workflow. This is displayed in the "Actions" tab.
name: Build and Push Frontend Docker Image

# --- Triggers ---
# Defines the events that will trigger this workflow to run.
on:
  # Allows manual triggering of the workflow from the GitHub Actions tab.
  workflow_dispatch:
  # Trigger the workflow on push events
  push:
    # Only for pushes to the main and develop branches
    branches:
      - main
      - develop
    # Only if changes are detected in these specific paths
    paths:
      - "frontend/**"
      - ".github/workflows/docker-build-push-frontend.yml"
  # Also trigger on pull request events
  pull_request:
    # Only for pull requests targeting the main and develop branches
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/docker-build-push-frontend.yml"

# --- Environment Variables ---
# Variables available to all jobs in this workflow.
env:
  REGISTRY: docker.io # Specifies the Docker registry to use (Docker Hub)

# --- Jobs ---
# A workflow run is made up of one or more jobs, which run in parallel by default.
jobs:
  # The single job in this workflow, responsible for building the frontend image.
  build:
    # The type of runner that the job will run on.
    runs-on: ubuntu-latest
    # Permissions granted to the GITHUB_TOKEN for this job.
    permissions:
      contents: read # Required to check out the repository code.
      packages: write # Required to push Docker images to a registry like Docker Hub.

    # --- Steps ---
    # A sequence of tasks that will be executed as part of the job.
    steps:
      # Step 1: Check out the repository's code so the job can access it.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true # Required to fetch BuildingBlocks submodule

      # Step 2: Set up Docker Buildx, an advanced builder that enables features like caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to the Docker registry (Docker Hub).
      - name: Log in to Docker Hub
        # This step only runs on 'push' events, not on 'pull_request' events.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }} # Username stored securely in GitHub Secrets.
          password: ${{ secrets.DOCKER_PASSWORD }} # Password or token stored securely in GitHub Secrets.

      # Step 4: Automatically generate tags and labels for the Docker image.
      - name: Extract metadata (tags, labels)
        id: meta # Assign an ID to reference its outputs.
        uses: docker/metadata-action@v5
        with:
          # The full image name for frontend service.
          images: ${{ env.REGISTRY }}/${{ github.repository }}-frontend
          # Rules for generating tags based on Git events.
          tags: |
            type=ref,event=branch       # Tag with branch name (e.g., 'main')
            type=ref,event=pr           # Tag with pull request number (e.g., 'pr-123')
            type=sha,prefix={{branch}}- # Tag with branch and short commit SHA (e.g., 'main-a1b2c3d')
            type=raw,value=latest,enable={{is_default_branch}} # Tag 'latest' only for the default branch (usually 'main')

      # Step 5: Build the Docker image and push it to the registry.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # The build context (directory) for frontend.
          context: ./frontend
          # The path to the Dockerfile.
          file: ./frontend/Dockerfile
          # Push the image only on 'push' events, not on 'pull_request' events.
          push: ${{ github.event_name != 'pull_request' }}
          # Use the tags and labels generated by the 'meta' step.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache to speed up future builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Pass build arguments for frontend
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_GIT_COMMIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_DATE=${{ github.event.head_commit.timestamp }}
