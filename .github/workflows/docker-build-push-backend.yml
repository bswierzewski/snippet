name: Build and Push Backend Docker Image

# --- Triggers ---
on:
  workflow_dispatch:
  push:
    branches: ["main", "develop"]
    paths:
      - "backend/**"
      - ".github/workflows/docker-build-push-backend.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "backend/**"
      - ".github/workflows/docker-build-push-backend.yml"

# --- Environment ---
env:
  REGISTRY: ghcr.io
  # Image name must be lowercase for GitHub Container Registry
  IMAGE_NAME: ${{ github.repository }}-backend
  # Define working directory to avoid repetition
  WORKING_DIR: ./backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout Code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. Setup .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 3. Authenticate NuGet (Crucial for Clean nuget.config)
      # This injects credentials into the runner's session, so we don't need placeholders in nuget.config
      - name: Authenticate NuGet Source
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          dotnet nuget update source github \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text

      # 4. CI Phase: Create Env -> Test -> Cleanup
      # We combine these to be concise. 'dotnet test' handles restore/build implicitly.
      - name: Run Tests
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # 1. Generate temporary .env file for tests
          echo "Creating temporary .env file..."
          echo "${{ vars.ENV_FILE }}" > .env
          echo "${{ secrets.ENV_FILE }}" >> .env

          # 2. Run Tests (implicitly runs restore and build)
          # We use || true logic or standard exit codes. If test fails, workflow stops here.
          echo "Running tests..."
          dotnet test tests/Snippet.Tests.EndToEnd/Snippet.Tests.EndToEnd.csproj -c Release

          # 3. Cleanup .env immediately
          echo "Cleaning up..."
          rm -f .env

      # 5. Login to Registry (Required for Pushing)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. CD Phase: Publish Container
      # We use Native .NET Container build support (no Dockerfile needed).
      - name: Publish Container Image
        if: github.event_name != 'pull_request'
        working-directory: ${{ env.WORKING_DIR }}/src/Host/Snippet.Web
        run: |
          # --- Tagging Strategy ---
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')

          # 1. Use literal semicolons
          TAGS="${BRANCH}-${SHORT_SHA};${BRANCH}"

          if [[ "$BRANCH" == "main" ]]; then
            TAGS="${TAGS};latest"
          fi

          echo "Publishing with tags: $TAGS"

          # 2. THE FIX:
          # Use escaped quotes \" around the variable inside the string.
          # Bash sends: -p:ContainerImageTags="tag1;tag2"
          # MSBuild sees quotes and treats "tag1;tag2" as a single value containing separators.
          dotnet publish -c Release \
            --os linux \
            --arch x64 \
            -p:ContainerRegistry=${{ env.REGISTRY }} \
            -p:ContainerRepository=${{ env.IMAGE_NAME }} \
            "-p:ContainerImageTags=\"$TAGS\"" \
            -p:ContainerPort=7000 \
            /t:PublishContainer
