# Workflow name displayed in the GitHub Actions UI.
name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Allows this workflow to be triggered manually from the Actions tab. Useful for debugging.
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code, including any Git submodules.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # Step 2: Check if relevant files have changed before proceeding.
      # This prevents running slow E2E tests for unrelated changes (e.g., frontend or documentation).
      - name: Check for backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/e2e-tests.yml'

      # The following steps will only run if the 'backend' filter from the previous step is 'true'.

      - name: Setup .NET
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: dotnet restore

      - name: Build solution
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: dotnet build --no-restore --configuration Release

      - name: Run E2E Tests
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: dotnet test tests/Snippet.Tests.EndToEnd/Snippet.Tests.EndToEnd.csproj --no-build --configuration Release --verbosity normal
        env:
          DOTNET_ENVIRONMENT: Testing

          # Specifies which authentication provider to use for tests
          AUTH_PROVIDER: Supabase

          # Double-underscore format is used to map environment variables to nested appsettings.json configuration.
          # This section configures the backend API for token validation during tests.
          AUTHENTICATION__SUPABASE__PROJECTURL: ${{ secrets.AUTHENTICATION__SUPABASE__PROJECTURL }}
          AUTHENTICATION__SUPABASE__AUDIENCE: authenticated
          AUTHENTICATION__SUPABASE__JWTSECRET: ${{ secrets.AUTHENTICATION__SUPABASE__JWTSECRET }}

          # Placeholder connection strings - will be replaced by TestWebApplicationFactory with testcontainers
          ConnectionStrings__UsersConnection: "Host=placeholder;Database=placeholder;Username=placeholder;Password=placeholder"
          ConnectionStrings__SnippetsConnection: "Host=placeholder;Database=placeholder;Username=placeholder;Password=placeholder"

          # Logging configuration - reduce verbosity for CI environment
          # Only show warnings and errors to minimize log output (~85% reduction)
          Logging__LogLevel__Default: Information
          Logging__LogLevel__Microsoft.AspNetCore: Warning
          Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
          Logging__LogLevel__BuildingBlocks: Warning

          # This section provides credentials for the test client to generate authentication tokens.
          # The format may be different if the test client has its own configuration mechanism.
          AUTHENTICATION__SUPABASE__URL: ${{ secrets.AUTHENTICATION__SUPABASE__URL }}
          AUTHENTICATION__SUPABASE__KEY: ${{ secrets.AUTHENTICATION__SUPABASE__KEY }}
          AUTHENTICATION__SUPABASE__TESTEMAIL: ${{ secrets.AUTHENTICATION__SUPABASE__TESTEMAIL }}
          AUTHENTICATION__SUPABASE__TESTPASSWORD: ${{ secrets.AUTHENTICATION__SUPABASE__TESTPASSWORD }}

      # This step provides clear feedback in the logs if the tests were intentionally skipped.
      - name: Notify if tests were skipped
        if: steps.changes.outputs.backend == 'false'
        run: echo "E2E tests were skipped because no changes were detected in the backend."
