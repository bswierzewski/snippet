# Workflow name displayed in the GitHub Actions UI.
name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # Allows this workflow to be triggered manually from the Actions tab. Useful for debugging.
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run End-to-End Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code, including any Git submodules.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      # Step 2: Check if relevant files have changed before proceeding.
      # This prevents running slow E2E tests for unrelated changes (e.g., frontend or documentation).
      - name: Check for backend changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/e2e-tests.yml'

      # The following steps will only run if the 'backend' filter from the previous step is 'true'.

      # Step 3: Load environment variables from GitHub Variables.
      # The ENV_FILE variable contains all environment variables needed for E2E tests:
      # - Authentication provider configuration (Supabase/Clerk/None)
      # - Database connection strings (replaced by TestWebApplicationFactory with testcontainers)
      # - Logging configuration
      # - Test user credentials
      # These variables are exported to $GITHUB_ENV to be available in subsequent steps.
      - name: Load environment variables
        if: steps.changes.outputs.backend == 'true'
        run: echo "${{ vars.ENV_FILE }}" >> $GITHUB_ENV

      - name: Setup .NET
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: dotnet restore

      - name: Build solution
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: dotnet build --no-restore --configuration Release

      - name: Run E2E Tests
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: dotnet test tests/Snippet.Tests.EndToEnd/Snippet.Tests.EndToEnd.csproj --no-build --configuration Release --verbosity normal

      # This step provides clear feedback in the logs if the tests were intentionally skipped.
      - name: Notify if tests were skipped
        if: steps.changes.outputs.backend == 'false'
        run: echo "E2E tests were skipped because no changes were detected in the backend."
